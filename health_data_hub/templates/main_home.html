<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Health Data Hub" />
    <meta name="author" content="Meta-inspired Dev" />
    <title>Health Data Hub</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.ico' %}" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Core theme CSS (includes Bootstrap) -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />

    <!-- Custom inline styles -->
    <style>
        .btn-lg {
            padding: 0.75rem 2rem;
            font-size: 1.25rem;
        }
        .hero-section {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero-title {
            font-size: 3rem;
            color: white;
            margin-bottom: 2rem;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.5rem;
        }
    </style>
</head>

<body class="d-flex flex-column h-100 bg-dark text-white">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
        <div class="container px-4">
            <a class="navbar-brand" href="#">
                <i class="bi bi-heart-pulse-fill text-danger"></i> Health Data Hub
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-shrink-0">
        <section class="hero-section">
            <h1 class="hero-title">Welcome to Health Data Hub</h1>
            <div class="d-flex flex-column flex-md-row gap-3">
                <a href="host-login/" class="btn btn-primary btn-lg">
                    <i class="bi bi-cloud-upload-fill me-2"></i> Host
                </a>
                <a href="patient-login/" class="btn btn-outline-light btn-lg">
                    <i class="bi bi-person-lines-fill me-2"></i> Patient
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    {% include 'host_templates/partials/_footer.html' %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/formvalidation@1.5.0/dist/js/FormValidation.min.js"></script>
</body>
</html>
